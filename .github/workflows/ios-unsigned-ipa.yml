name: Build unsigned iPhone IPA (free Apple ID sideload)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: |
          xcodebuild -version
          node --version
          ruby --version

      - name: Install JavaScript dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --check
          npm run check:assets

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Release without signing
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then echo 'Missing Xcode workspace'; exit 1; fi
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Workspace=$WORKSPACE Scheme=$SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SafeDistance.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 120

      - name: Package unsigned .ipa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          APP="$(find "$RUNNER_TEMP/SafeDistance.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then echo 'App was not created'; exit 1; fi
          cp -R "$APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$GITHUB_WORKSPACE/SafeDistance-unsigned.ipa" Payload)
          ls -lh SafeDistance-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafeDistance-unsigned-IPA
          path: SafeDistance-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
